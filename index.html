function load(){return api("read").then(function(r){if(!r.ok)throw r;B.rows=r.rows||[];if(r.users&&r.users.length)B.users=r.users;if(r.statuses&&r.statuses.length)B.statuses=r.statuses;if(r.categories)B.categories=r.categories;B.loaded=true;render()}).catch(fail)}
function catList(){if(B.categories.length)return B.categories;var l=[];B.rows.forEach(function(r){if(r.category&&l.indexOf(r.category)<0)l.push(r.category)});return l}
function formBody(v){var cl=catList().slice();if(v.category&&cl.indexOf(v.category)<0)cl.push(v.category);
 return'<div class="seg" id="f_seg">'+B.statuses.map(function(s){return'<button type="button" data-v="'+esc(s)+'"'+(s===v.status?' class="on"':'')+'>'+esc(s)+'</button>'}).join("")+'</div>'+
 '<label class="fl" for="f_sub">Subject</label><input class="fi" id="f_sub" value="'+esc(v.subject)+'" placeholder="What is it for?" autocomplete="off">'+
 '<label class="fl" for="f_cat">Category</label><select class="fi" id="f_cat"><option value="">Select category</option>'+cl.map(function(c){return'<option'+(c===v.category?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'</select>'+
 '<label class="fl" for="f_date">Date</label><div class="fdw"><input class="fi" type="date" id="f_date" value="'+toIn(v.date)+'"><span>📅</span></div>'+
 '<label class="fl" for="f_bud">Budget (Rp)</label><input class="fi" id="f_bud" type="number" inputmode="numeric" min="0" placeholder="0" value="'+(v.budget===""||v.budget==null?"":v.budget)+'">'+
 '<div class="fl">User</div><div class="fchips" id="f_users">'+B.users.map(function(u){return'<button type="button" data-v="'+esc(u)+'"'+(u===v.user?' class="on"':'')+'>'+esc(u)+'</button>'}).join("")+'</div>'}
var blank=function(){return{date:today(),status:B.statuses[0],user:B.users[0],category:"",subject:"",budget:""}};
function openForm(r){B.edit=r?r.row:"new";$("fh").textContent=r?"Edit Budget":"Add Budget";$("fbody").innerHTML=formBody(r||blank());
 var s=$("fsave");s.textContent=r?"Save":"Add";s.className="fs "+(r?"edit":"add");$("ov").hidden=false;document.body.style.overflow="hidden";$("shx").scrollTop=0}
function closeForm(){$("ov").hidden=true;document.body.style.overflow="";B.edit=null}
function rowHtml(r,noAct){var st=(r.status||"").toLowerCase(),cl=st.indexOf("est")===0?"est":st==="firm"?"firm":"",ci=catIcon(r.category);
 return'<div class="tx" data-row="'+r.row+'"><div class="tx-ic" style="background:'+ci[1]+'">'+ci[0]+'</div>'+
 '<div class="tx-m"><small class="tx-d">'+esc(r.date)+'</small><b class="tx-s">'+esc(r.subject)+'</b><div class="tx-u"><span>'+esc(r.user)+'</span><span class="pill '+cl+'">'+esc(r.status||"-")+'</span></div></div>'+
 '<div class="tx-r"><div class="neg">'+rp(r.budget)+'</div>'+(!noAct&&B.mode==="edit"?'<div class="tx-a"><button data-a="edit" data-row="'+r.row+'" aria-label="Edit">'+ico("pen",16)+'</button><button class="del" data-a="del" data-row="'+r.row+'" aria-label="Remove">'+ico("bin",16)+'</button></div>':'')+'</div></div>'}
var sum=function(rows){return rows.reduce(function(a,r){return a+r.budget},0)};
function group(rows,keyf,seed){var m={};(seed||[]).forEach(function(k){m[k]={n:0,t:0}});rows.forEach(function(r){var k=keyf(r);m[k]=m[k]||{n:0,t:0};m[k].n++;m[k].t+=r.budget});return Object.keys(m).map(function(k){return{k:k,n:m[k].n,t:m[k].t}}).sort(function(a,b){return b.t-a.t})}
function donut(g,tot){var R=52,C=2*Math.PI*R,live=g.filter(function(x){return x.t>0}),gap=live.length>1?19:0,off=0,
 h='<svg class="dn" viewBox="0 0 150 150"><circle cx="75" cy="75" r="52" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="14"/>';
 g.forEach(function(x,i){if(!x.t)return;var sh=x.t/tot*C,len=Math.max(sh-gap,.01);h+='<circle class="seg" cx="75" cy="75" r="52" fill="none" stroke="'+COLORS[i%COLORS.length]+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-(off+gap/2)).toFixed(2)+'" transform="rotate(-90 75 75)"/>';off+=sh});
 return h+'<circle cx="75" cy="75" r="39" fill="#fff" opacity=".78"/><text x="75" y="68" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5b6b85">Total</text><text x="75" y="87" text-anchor="middle" font-size="17" font-weight="800" fill="#111">'+short(tot)+'</text></svg>'}
function renderSummary(){if(B.sumUser&&B.users.indexOf(B.sumUser)<0)B.sumUser="";
 var rows=B.sumUser?B.rows.filter(function(r){return r.user===B.sumUser}):B.rows,tot=sum(rows),g=group(rows,function(r){return r.category||"Uncategorized"},catList());
 var sel='<select id="s_user"><option value="">All users</option>'+B.users.map(function(u){return'<option'+(u===B.sumUser?" selected":"")+'>'+esc(u)+'</option>'}).join("")+'</select>';
 var lg=g.map(function(x,i){return x.t>0?'<span><i style="background:'+COLORS[i%COLORS.length]+'"></i>'+esc(x.k)+' '+Math.round(x.t/tot*100)+'%</span>':""}).join("");
 var h='<div class="sb"><div class="sb-top"><div><small>'+(B.sumUser?esc(B.sumUser)+"’s total cost":"Total cost")+'</small><span class="amt">'+rp(tot)+'</span></div>'+sel+'</div>'+donut(g,tot)+(lg?'<div class="lg">'+lg+'</div>':'')+'</div>'+
 '<div class="sh"><span>By category</span><small>'+rows.length+' item'+(rows.length===1?"":"s")+'</small></div><div class="cg">'+
 (g.map(function(x,i){var pc=tot?Math.round(x.t/tot*100):0,ci=catIcon(x.k),col=COLORS[i%COLORS.length];return'<div class="ct" data-cat="'+esc(x.k)+'"><div class="ct-top"><div class="ct-ic" style="background:'+ci[1]+'">'+ci[0]+'</div><span class="pc">'+pc+'%</span></div><div class="bar"><i style="width:'+pc+'%;background-color:'+col+'"></i></div><b>'+esc(x.k)+'</b><span class="amt">'+rp(x.t)+'</span><small>'+x.n+' item'+(x.n===1?"":"s")+'</small></div>'}).join("")||'<div class="empty" style="grid-column:1/-1">No data yet</div>')+'</div>';
 $("sum").innerHTML=h}
function openCat(k){var rows=(B.sumUser?B.rows.filter(function(r){return r.user===B.sumUser}):B.rows).filter(function(r){return(r.category||"Uncategorized")===k}),ci=catIcon(k);
 $("cph").textContent=k;$("cpbody").innerHTML='<div class="cp-sum"><div class="tx-ic" style="background:'+ci[1]+'">'+ci[0]+'</div><div><b>'+rp(sum(rows))+'</b><small>'+rows.length+' purchase'+(rows.length===1?"":"s")+(B.sumUser?" · "+esc(B.sumUser):"")+'</small></div></div><div class="cp-l">'+(rows.map(function(r){return rowHtml(r,true)}).join("")||'<div class="empty">No purchases</div>')+'</div>';
 $("cpv").hidden=false;document.body.style.overflow="hidden";$("cps").scrollTop=0}
function closeCat(){$("cpv").hidden=true;document.body.style.overflow=""}
function render(){$("dinfo").textContent=B.rows.length+" items · Total "+rp(sum(B.rows));
 $("dtb").innerHTML=B.rows.map(function(r){return rowHtml(r)}).join("")||'<div class="empty">No budget items yet. Tap “＋ Add”.</div>';renderSummary();updBar()}
function save(){var on=function(id){var b=$(id).querySelector(".on");return b?b.dataset.v:""};
 var d={date:fromIn($("f_date").value),category:$("f_cat").value,subject:$("f_sub").value.trim(),budget:$("f_bud").value===""?NaN:+$("f_bud").value,user:on("f_users")||B.users[0],status:on("f_seg")||B.statuses[0]};
 if(!d.date||!d.subject||isNaN(d.budget)){toast("Please fill subject, date and budget",true);return}
 var id=B.edit;busy(true);api(id==="new"?"add":"update",id==="new"?{data:d}:{row:+id,data:d}).then(function(r){if(!r.ok)throw r;closeForm();toast("Saved to sheet ✓");return load()}).catch(fail).then(function(){busy(false)})}
function del(row){if(!window.confirm("Remove this budget item?"))return;
 busy(true);api("delete",{row:+row}).then(function(r){if(!r.ok)throw r;toast("Removed ✓");return load()}).catch(fail).then(function(){busy(false)})}
$("dtb").addEventListener("click",function(e){var b=e.target.closest("button[data-a]");if(!b||B.busy)return;var a=b.dataset.a;
 if(a==="edit"){var r=B.rows.filter(function(x){return x.row===+b.dataset.row})[0];if(r)openForm(r)}else if(a==="del")del(b.dataset.row)});
$("badd").onclick=function(){if(!B.busy)openForm(null)};
$("bedit").onclick=function(){if(B.busy)return;B.mode=B.mode==="edit"?"view":"edit";render()};
$("fx").onclick=closeForm;
$("ov").addEventListener("click",function(e){if(e.target===$("ov")&&!B.busy)closeForm()});
$("fclear").onclick=function(){$("fbody").innerHTML=formBody(blank())};
$("fsave").onclick=function(){if(!B.busy)save()};
$("fbody").addEventListener("click",function(e){var b=e.target.closest("button[data-v]");if(!b)return;Array.prototype.forEach.call(b.parentNode.children,function(x){x.classList.toggle("on",x===b)})});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(!$("cpv").hidden)closeCat();else if(!$("ov").hidden&&!B.busy)closeForm()}});
$("sum").addEventListener("click",function(e){var t=e.target.closest(".ct[data-cat]");if(t)openCat(t.dataset.cat)});
$("cpx").onclick=closeCat;$("cpv").addEventListener("click",function(e){if(e.target===$("cpv"))closeCat()});
$("ppok").onclick=function(){$("pp").hidden=true;if(!$("lock").hidden)$("l_pass").focus()};
$("badd").innerHTML=ico("plus",26)+"<span>Add</span>";
$("sum").addEventListener("change",function(e){if(e.target.id==="s_user"){B.sumUser=e.target.value;renderSummary()}});
Array.prototype.forEach.call($("btabs").querySelectorAll("button"),function(b){b.onclick=function(){
 Array.prototype.forEach.call($("btabs").children,function(x){x.className=x===b?"on":""});$("dash").hidden=b.dataset.t!=="dash";$("sum").hidden=b.dataset.t!=="sum";window.scrollTo(0,0);updBar()}});
$("unlock").onclick=function(){var u=APPS_URL||$("l_url").value.trim(),p=$("l_pass").value;
 if(!u||!p){$("lmsg").textContent=APPS_URL?"Please enter the passcode.":"Please enter the script URL and the passcode.";return}
 if(!APPS_URL)LS.s("bud_url",u);LS.s("bud_pass",p);showBudget();B.loaded=false;$("dtb").innerHTML='<div class="empty">Loading…</div>';load()};
$("l_pass").addEventListener("keydown",function(e){if(e.key==="Enter")$("unlock").click()});
$("block").onclick=function(){LS.d("bud_pass");B.edit=null;B.mode="view";showLock("")};
function initBudget(){if(!url()||!LS.g("bud_pass")){showLock("");return}showBudget();if(!B.loaded)$("dtb").innerHTML='<div class="empty">Loading…</div>';load()}
/* menu */
var ml=$("mlist");
$("mbtn").onclick=function(e){e.stopPropagation();ml.hidden=!ml.hidden;$("mbtn").setAttribute("aria-expanded",String(!ml.hidden))};
document.addEventListener("click",function(e){if(!$("menu").contains(e.target)){ml.hidden=true;$("mbtn").setAttribute("aria-expanded","false")}});
function showPage(id){$("p1").hidden=id!=="p1";$("p2").hidden=id!=="p2";
 Array.prototype.forEach.call(ml.querySelectorAll("button"),function(b){var on=b.dataset.p===id;b.className=on?"on":"";if(on)$("mic").textContent=b.querySelector("span").textContent});
 ml.hidden=true;$("mbtn").setAttribute("aria-expanded","false");window.scrollTo(0,0);
 if(id==="p1"){updBar();setTimeout(function(){window.dispatchEvent(new Event("resize"))},30)}else initBudget()}
Array.prototype.forEach.call(ml.querySelectorAll("button"),function(b){b.onclick=function(){showPage(b.dataset.p)}});
})();
</script>
</body>
</html>
